# ponos — configuration, ~/.config/ponos/config.toml
#
# About thirty keys, and every one is also in the console's Settings (it writes
# into this very file, one line at a time, and leaves these comments alone).
# Everything not named here is a constant of the code — the retired keys, and
# what each became, are listed in CHANGELOG.md. A file that still holds one is
# read all the same: `ponos doctor` names it. After any change:  ponos doctor
#
# Secrets — tokens, keys, passwords — are never here. They live in the
# environment or in ~/.config/ponos/secrets.env (NAME=value, 0600; PONOS_SECRETS
# moves it): PONOS_NOTION_TOKEN, PONOS_WEB_TOKEN, PONOS_WEB_PASSWORD,
# PONOS_TELEGRAM_TOKEN, PONOS_SLACK_TOKEN, ANTHROPIC_API_KEY, OPENROUTER_API_KEY,
# PONOS_GITHUB_TOKEN. Where both hold one, secrets.env wins (the console's
# password: the environment).

[notion]
# Optional: the tickets live in ponos.db either way. With a token, Notion also
# holds the projects, agents, goals, schedules and context, and mirrors the
# tickets. The page must be shared with the integration.
# `ponos init <url-of-a-notion-page>` builds the databases and writes this line.
workspace = ""
# Only to point at one database rather than a whole workspace (a URL is enough).
tickets_database = ""
# What you type in a comment to get an answer rather than a run.
mention = "@claude"

# Which row of the workspace is what (title, case ignored). Only `tickets` is
# required; `ponos init` names the others.
[notion.pages]
tickets = "Tickets"
projects = "Projects"
# agents, context, schedules, goals: see `ponos init`

[runner]
workspace_root = "~/workspace"   # where the repositories are cloned and found
interval_seconds = 1800          # the daemon looks at the whole board at least this often
max_concurrent = 2               # sessions at once
timeout_minutes = 30             # one session
language = ""                    # of the reports: "fr", "en"; empty is English
app_language = ""                # of the console; empty follows language, then the browser
model = ""                       # a session's model; empty is the CLI's own
base_branch = ""                 # empty is the repository's default branch
merge_method = "squash"          # "squash", "merge" or "rebase"
# The types of ticket validated without waiting for your review: "code" (merged),
# "publication" (published), "writing", "external".
force_validated = []
local_ci = false                 # run the project's CI in Docker before the push
self_review = true               # a second session reads the diff before the pull request
unblock = false                  # try once to unblock a ticket that waits on its own
wait_for_credits = true          # no new session while the account is out of credit
auto_update = true
update_channel = "release"       # "release" (tags) or "main" (every commit)
# Ideas found on a schedule: the Planned page writes these, no need to by hand.
# ideas_schedule = "off"   # "off", "every_4h", "daily", "weekly", "hours", "cron"
# ideas_at = "09:00"
# ideas_day = "Monday"
# ideas_every_hours = 6
# ideas_cron = ""
# ideas_scope = "all"      # "all" or "selected" (ideas_projects)
# ideas_projects = ""
# ideas_workspace = false
# ideas_per_batch = 10
# ideas_skip_above = 20    # not while this many ideas wait
# ideas_budget_usd = 0.0
# ideas_notify = false
# ideas_model = ""

[claude]
# Who answers the sessions: "cli" (claude login), "api_key" (ANTHROPIC_API_KEY)
# or "openrouter" (OPENROUTER_API_KEY). Empty: the CLI, else the first key found.
provider = ""

# In dollars, empty or 0 is no limit. Only meaningful on an API key or OpenRouter:
# a subscription reports no cost. daily_usd: since local midnight, past it
# nothing new starts. per_ticket_usd: one session, which the CLI stops cleanly.
[budget]
daily_usd = ""
per_ticket_usd = ""

# Sentences in your own words, put in every session's prompt: what it does alone
# (allowed), and what always waits for your word (ask, the ticket ends blocked
# with the question). A list written empty is an answer: nothing is allowed
# alone, or nothing is held back. A key left out is the default shown here.
[permissions]
allowed = [
  "taguer et publier une release d'un dépôt du projet, après fusion sur main",
  "cloner un dépôt du propriétaire GitHub du projet, ou d'un propriétaire que [github] nomme, manquant dans le workspace et lui créer un projet Ponos",
  "relancer une CI",
  "fusionner une PR validée",
]
ask = [
  "publier sur un registre public (npm, PyPI…)",
  "ouvrir une PR ou une issue sur un dépôt tiers",
  "toute action qui envoie un e-mail ou un message à quelqu'un d'autre que l'utilisateur",
  "supprimer des données de production",
  "modifier un DNS",
  "toute dépense",
]

[notify]
desktop = true                          # a desktop notification when a ticket finishes
events = ["blocked", "failed", "done"]  # the moments worth a message
digest = "off"                          # a summary of the period: "daily" or "weekly"

# A reply on Telegram or Slack becomes a comment on the ticket. Anybody in the chat can answer
# (and on Telegram run commands) unless allowed_users names who may: ids or handles.
[notify.telegram]
chat = ""
# allowed_users = []

[notify.slack]
channel = ""
# allowed_users = []

[web]
host = "127.0.0.1"
port = 8787
url = ""      # the address the console is reached at, for the links in messages
email = ""    # the sign-in e-mail (PONOS_WEB_EMAIL wins); the password is a secret
library_max_mb = 50  # the most a file of Context → Library may weigh, in MB

# Older files only: a project's path is set in its Settings tab now (ponos.db).
[projects]
# "Trader Ia" = "~/workspace/labo/trader-ia"

# Which `gh` account each repository owner is worked under, for a machine that
# answers to two GitHubs: owner (as in the URL) = account (as `gh auth status`
# lists it). A GitHub App or token (below) comes first for the owners it covers.
[github]
# "northwind" = "dev-northwind"

# How GitHub is reached without `gh`. mode: "app" or "token" puts that one
# first; empty is the App when one reaches the owner, then the token, then `gh`.
# The token is PONOS_GITHUB_TOKEN; token_item keeps it in a vault instead
# (`pass:ponos/github`, `keyring:ponos-github`, `bitwarden:github`).
[github_access]
mode = ""
# token_item = "pass:ponos/github"

# The keys a project's sessions are given as environment variables, masked as ***
# wherever the runner writes. provider: "env", "keyring", "pass", "bitwarden" or
# "ponos" (Settings → Vault); an item may name another: "pass:hermez/npm".
[vault]
provider = "env"

# Older files only: a project's keys are set in its Settings tab now (ponos.db).
[vault.projects]
# Leadz = ["LEADZ_DOKPLOY_TOKEN"]
