# A tag is the only trigger, and the tag is the whole request.
#
# Pushing `v0.2.0` is what publishes 0.2.0: this workflow re-runs both suites at
# that exact commit, then turns the tag into a GitHub release whose body is the
# `## [0.2.0]` section of CHANGELOG.md. Nothing here decides a version or writes
# a note — `scripts/release.py` reads both out of the tree the tag points at, and
# refuses if the tag and `__version__` disagree, which is what a tag placed on the
# wrong commit looks like.
#
# `publish` is idempotent, so a re-run of a failed job is safe, and so is doing
# it by hand: `python3 scripts/release.py publish` from a checkout of the tag.
#
# A tag pushed with the workflow token starts no other workflow, so when ci.yml
# tags a version merged on main it starts this one itself, on the tag: a
# `workflow_dispatch` run on a tag ref sees the same `GITHUB_REF_NAME` as a push.
#
# The image goes out with it, to ghcr.io: `ghcr.io/<owner>/ponos:<version>` and
# `:latest`, built from the same commit, once the suites have passed — a
# container is updated by pulling it, so a tag is also what `docker compose
# pull` brings.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: What the runner imports
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements.txt

      - name: The suite, at the tagged commit
        run: python3 tests/run.py

      # A tag is what installations on the release channel update to, so the
      # road a ticket travels is checked here too, not only its pure half.
      - name: The whole road, at the tagged commit
        run: python3 tests/functional.py

      - name: The GitHub release, from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish

  image:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: The names it goes out under
        id: names
        run: |
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/ponos"
          version="${GITHUB_REF_NAME#v}"
          echo "tags=$image:$version,$image:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.names.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
