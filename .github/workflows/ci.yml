# Ce qui protège une pull request avant qu'elle ne devienne un commit sur
# `main` — le runner ouvre lui-même ses PR, et les installations qui suivent
# `update_channel = "main"` prennent chaque commit sans attendre un tag.
#
# Le job cœur tourne toujours : les deux suites n'ont pas de dépendance, elles
# n'ont pas de raison d'être sautées. `tests/functional.py` a besoin de `git`,
# que le runner GitHub a déjà, et de rien d'autre : son Notion, son dépôt et son
# `claude` sont à lui. Il tourne sur la plus ancienne version de Python que le
# runner promet (3.11) et sur la plus récente, parce qu'une installation prend
# le `python3` de la machine, quel qu'il soit.
#
# Le job frontend ne tourne que si `frontend/**` (ses tests e2e compris) ou
# `src/ponos/web/**` a changé, pour ne pas payer npm sur des tickets qui
# n'y touchent pas : le serveur de la console fait partie de ce que les tests
# e2e ouvrent — le chat, par exemple, c'est d'abord son API —, et un main dont
# seul le Python de la console a bougé restait vert sans avoir lancé ses e2e. Et il vérifie que `web/static/`, que le
# runner sert tel qu'il est commité, est bien ce que le build produit : une
# console modifiée sans son build commité serait une console que personne ne
# reçoit. Le même build copie les jetons de la console dans `docs/tokens.css`,
# que le site lit : la copie est vérifiée ici, et par `tests/run.py` à chaque
# pull request, frontend touché ou non. Il ouvre enfin la console dans le Chrome
# du runner GitHub (`npm run test:e2e`), servie par le vrai `ponos
# serve` sur un board de fichiers : ce qu'un navigateur fait d'une page — la
# faire défiler, par exemple — aucune des deux suites ne le voit.
# Node 24, parce que `npm test` fait lire à `node --test` les tests de
# la barre de message écrits en TypeScript, sans rien installer pour ça.
#
# Le job qualité est le seul à installer quelque chose : l'outillage de
# `pyproject.toml`, aux versions de `uv.lock` (`uv sync --locked` échoue si le
# lockfile ne correspond plus au pyproject). Il passe ruff — les règles du
# pyproject, puis `ruff format --check` —, vérifie que `requirements.txt`, ce que les
# installations mettent dans leur environnement, est bien l'export du lockfile,
# puis lance les deux suites sous pytest, avec la couverture et les dix cas les
# plus lents. Le job cœur reste tel quel : c'est lui qui prouve que le runner et
# ses tests tournent sans rien installer.
#
# Le job image construit le `Dockerfile` et relance `tests/functional.py` dans
# l'image qu'il vient de construire : c'est une autre façon d'installer le
# runner, et ce qu'elle apporte — le Python 3.13 de l'image, son git, son
# utilisateur qui n'est pas root — doit faire passer le même parcours. Le dépôt
# est monté en lecture seule : la suite n'écrit que dans ses dossiers jetables.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Lire le dépôt, et rien d'autre : aucun job n'écrit quoi que ce soit.
permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: La suite du cœur
        run: python3 tests/run.py

      - name: Le parcours complet
        run: python3 tests/functional.py

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: L'outillage, aux versions du lockfile
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: requirements.txt est l'export du lockfile
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.txt
          git diff --exit-code -- requirements.txt

      - name: Les deux suites, sous pytest
        run: uv run pytest --cov=src/ponos --cov-report=term:skip-covered

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'src/ponos/web/**'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.frontend == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installation
        if: steps.changes.outputs.frontend == 'true'
        run: npm ci
        working-directory: frontend

      - name: Lint
        if: steps.changes.outputs.frontend == 'true'
        run: npm run lint
        working-directory: frontend

      - name: Tests
        if: steps.changes.outputs.frontend == 'true'
        run: npm test
        working-directory: frontend

      - name: Build
        if: steps.changes.outputs.frontend == 'true'
        run: npm run build
        working-directory: frontend

      - name: Le build commité est celui que le code produit
        if: steps.changes.outputs.frontend == 'true'
        run: |
          git diff --exit-code -- src/ponos/web/static docs/tokens.css
          untracked="$(git status --porcelain -- src/ponos/web/static docs/tokens.css)"
          if [ -n "$untracked" ]; then
            echo "src/ponos/web/static ou docs/tokens.css n'est pas à jour : lancez npm run build et commitez le résultat"
            echo "$untracked"
            exit 1
          fi

      - name: La console dans un navigateur
        if: steps.changes.outputs.frontend == 'true'
        run: npm run test:e2e:ci
        working-directory: frontend

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Docker Hub limite les tirages anonymes par IP, et celles des runners
      # sont partagées : un 429 sur node ou python fait échouer le job sans
      # que le code y soit pour rien. Le miroir de Google sert les mêmes images.
      - name: Les images de base, par le miroir de Docker Hub
        run: |
          sudo mkdir -p /etc/docker
          [ -s /etc/docker/daemon.json ] || echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' /etc/docker/daemon.json | sudo tee /etc/docker/daemon.json.new >/dev/null
          sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: L'image
        run: docker build -t ponos:ci .

      - name: Le parcours complet, dans l'image
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo ponos:ci python3 tests/functional.py
