# Ce qui protège une pull request avant qu'elle ne devienne un commit sur
# `main` — le runner ouvre lui-même ses PR, et les installations qui suivent
# `update_channel = "main"` prennent chaque commit sans attendre un tag.
#
# Le job cœur tourne toujours : les deux suites n'ont pas de raison d'être
# sautées. Il installe ce que le cœur importe — `requirements.txt`, avec ses
# sommes, comme une installation le met dans son `.venv` : httpx pour le runner,
# FastAPI et uvicorn pour la console —, et rien d'autre. `tests/run.py` vérifie
# que rien hors de `web/app.py`, `web/routes.py` et de httpx dans `http.py`
# n'importe autre chose que la bibliothèque standard.
# `tests/functional.py` a besoin de `git`, que le runner GitHub a déjà : son
# Notion, son dépôt et son `claude` sont à lui. Il tourne sur la plus ancienne version de Python que le
# runner promet (3.11) et sur la plus récente, parce qu'une installation prend
# le `python3` de la machine, quel qu'il soit. Chaque suite répartit ses cas sur
# un processus par cœur (`support.run`), comme `pytest -n auto` le fait ailleurs.
# La partie pure tourne une seconde fois sous `TZ=Australia/Sydney` : le runner
# GitHub est en UTC, qui n'a pas d'heure d'été, et un cas qui confond l'offset
# d'une date avec celui d'aujourd'hui n'y échoue jamais. Sydney change d'heure
# à l'inverse de Paris : à toute saison, l'un des deux est à l'heure d'été.
#
# Le job frontend ne tourne que si `frontend/**` (ses tests e2e compris) ou
# `src/ponos/web/**` a changé, pour ne pas payer npm sur des tickets qui
# n'y touchent pas : le serveur de la console fait partie de ce que les tests
# e2e ouvrent — le chat, par exemple, c'est d'abord son API —, et un main dont
# seul le Python de la console a bougé restait vert sans avoir lancé ses e2e. Et il vérifie que `web/static/`, que le
# runner sert tel qu'il est commité, est bien ce que le build produit : une
# console modifiée sans son build commité serait une console que personne ne
# reçoit. Le même build copie les jetons de la console dans `docs/tokens.css`,
# que le site lit : la copie est vérifiée ici, et par `tests/run.py` à chaque
# pull request, frontend touché ou non. Il ouvre enfin la console dans le Chrome
# du runner GitHub (`npm run test:e2e`), servie par le vrai `ponos
# serve` sur un board de fichiers : ce qu'un navigateur fait d'une page — la
# faire défiler, par exemple — aucune des deux suites ne le voit. Ce `serve`
# tourne sur le `python3` où `requirements.txt` vient d'être installé, FastAPI
# compris.
# Node 24, parce que `npm test` fait lire à `node --test` les tests de
# la barre de message écrits en TypeScript, sans rien installer pour ça.
# `npm run test:components` dessine ensuite les composants un par un sous
# Vitest et jsdom, avant le build : une régression de rendu y échoue en
# quelques secondes, sans attendre les e2e.
#
# Le job qualité installe le projet entier : la console et l'outillage de
# `pyproject.toml`, aux versions de `uv.lock` (`uv sync --locked` échoue si le
# lockfile ne correspond plus au pyproject). Il passe ruff — les règles du
# pyproject, puis `ruff format --check` —, vérifie que `requirements.txt`, ce que les
# installations mettent dans leur environnement, est bien l'export du lockfile,
# puis lance les deux suites sous pytest, réparties sur les cœurs (pytest-xdist),
# avec la couverture — qui doit rester à 80 % au moins — et les dix cas les plus
# lents. Le job cœur reste à part : c'est lui qui prouve que le runner et
# ses tests tournent avec ce que `requirements.txt` installe, et rien de plus.
#
# Le job image construit le `Dockerfile` et relance `tests/functional.py` dans
# l'image qu'il vient de construire : c'est une autre façon d'installer le
# runner, et ce qu'elle apporte — le Python 3.13 de l'image, son git, son
# utilisateur qui n'est pas root — doit faire passer le même parcours. Le dépôt
# est monté en lecture seule : la suite n'écrit que dans ses dossiers jetables.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Lire le dépôt, et rien d'autre : aucun job n'écrit quoi que ce soit.
permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Ce que le runner importe
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements.txt

      - name: La suite du cœur
        run: python3 tests/run.py

      - name: La suite du cœur, sous une heure d'été
        if: matrix.python-version == '3.13'
        run: python3 tests/run.py
        env:
          TZ: Australia/Sydney

      - name: Le parcours complet
        run: python3 tests/functional.py

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: L'outillage, aux versions du lockfile
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: requirements.txt est l'export du lockfile
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.txt
          git diff --exit-code -- requirements.txt

      - name: Les deux suites, sous pytest
        run: uv run pytest --cov=src/ponos --cov-report=term:skip-covered --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'src/ponos/web/**'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.frontend == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.frontend == 'true'
        with:
          python-version: "3.13"

      # Le `ponos serve` que les e2e ouvrent importe ce que le cœur importe.
      - name: Ce que le runner importe
        if: steps.changes.outputs.frontend == 'true'
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements.txt

      - name: Installation
        if: steps.changes.outputs.frontend == 'true'
        run: npm ci
        working-directory: frontend

      # Le même principe que pour web/static : les types de la page sont ce que
      # le schéma OpenAPI de la console décrit, jamais une copie à la main.
      - name: Les types de l'API sont ceux du schéma
        if: steps.changes.outputs.frontend == 'true'
        run: |
          npm run types
          git diff --exit-code -- src/lib/api-types.d.ts || {
            echo "frontend/src/lib/api-types.d.ts n'est pas à jour : lancez npm run types et commitez le résultat"
            exit 1
          }
        working-directory: frontend

      - name: Lint
        if: steps.changes.outputs.frontend == 'true'
        run: npm run lint
        working-directory: frontend

      - name: Tests
        if: steps.changes.outputs.frontend == 'true'
        run: npm test
        working-directory: frontend

      - name: Tests de composant
        if: steps.changes.outputs.frontend == 'true'
        run: npm run test:components
        working-directory: frontend

      - name: Build
        if: steps.changes.outputs.frontend == 'true'
        run: npm run build
        working-directory: frontend

      - name: Le build commité est celui que le code produit
        if: steps.changes.outputs.frontend == 'true'
        run: |
          git diff --exit-code -- src/ponos/web/static docs/tokens.css
          untracked="$(git status --porcelain -- src/ponos/web/static docs/tokens.css)"
          if [ -n "$untracked" ]; then
            echo "src/ponos/web/static ou docs/tokens.css n'est pas à jour : lancez npm run build et commitez le résultat"
            echo "$untracked"
            exit 1
          fi

      - name: La console dans un navigateur
        if: steps.changes.outputs.frontend == 'true'
        run: npm run test:e2e:ci
        working-directory: frontend

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Docker Hub limite les tirages anonymes par IP, et celles des runners
      # sont partagées : un 429 sur node ou python fait échouer le job sans
      # que le code y soit pour rien. Le miroir de Google sert les mêmes images.
      - name: Les images de base, par le miroir de Docker Hub
        run: |
          sudo mkdir -p /etc/docker
          [ -s /etc/docker/daemon.json ] || echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' /etc/docker/daemon.json | sudo tee /etc/docker/daemon.json.new >/dev/null
          sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: L'image
        run: docker build -t ponos:ci .

      - name: Le parcours complet, dans l'image
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo ponos:ci python3 tests/functional.py

  # Une version fusionnée sur main finit par son tag, sans que personne y pense :
  # c'est le tag qui publie la release et l'image (release.yml). Le jeton du
  # workflow ne déclenche pas d'autre workflow par un push de tag, d'où le
  # `gh workflow run` sur le tag — le déclenchement manuel, lui, est permis.
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Le tag de la version de main, s'il manque
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version="$(python3 scripts/release.py current)"
          if git ls-remote --exit-code --tags origin "v$version" >/dev/null; then
            echo "v$version existe déjà"
            exit 0
          fi
          python3 scripts/release.py tag --branch HEAD
          gh workflow run release.yml --ref "v$version"
