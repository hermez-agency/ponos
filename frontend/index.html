<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Ponos</title>
<link rel="icon" type="image/svg+xml" href="../docs/mascot/favicon.svg">
<!-- Installable as an app. `use-credentials`: the console is behind a cookie,
     and a manifest is fetched without it unless the page says otherwise. -->
<link rel="manifest" href="/static/manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="/static/pwa/apple-touch-icon.png">
<meta name="theme-color" content="#141414">
<script>
  /* Before the first paint, or the console flashes white on the way to dark.
     Dark is the default because the console it replaces had no other. */
  try {
    /* Migration filet: what this browser kept before the rename, under the
       old prefix, is taken over once — theme, language, widths, columns. */
    ["theme", "language", "talk-width", "board-empty-columns"].forEach(function (key) {
      var old = localStorage.getItem("ticket-runner-" + key);
      if (old !== null && localStorage.getItem("ponos-" + key) === null) localStorage.setItem("ponos-" + key, old);
      localStorage.removeItem("ticket-runner-" + key);
    });
    var kept = localStorage.getItem("ponos-theme");
    document.documentElement.classList.toggle("dark", kept !== "light");
  } catch (error) { /* a browser with storage switched off still gets dark */ }
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
