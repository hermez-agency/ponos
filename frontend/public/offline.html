<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ponos</title>
<style>
  html { background: #141414; color: #fafaf9; font: 16px/1.5 system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 1.5rem; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 1.25rem; margin: 1rem 0 .25rem; }
  p { margin: 0 0 1.25rem; color: #a8a29e; max-width: 28rem; }
  button { font: inherit; color: #141414; background: #f2803f; border: 0; border-radius: .6rem; padding: .5rem 1rem; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/static/pwa/icon-192.png" alt="">
  <h1 id="title">Ponos cannot reach its server</h1>
  <p id="text">The tickets live on the machine that runs Ponos, never in this app: check that it is on and that you are on the same network, then try again.</p>
  <button id="retry" type="button">Try again</button>
</main>
<script>
  /* The service worker serves this page when the console does not answer, and
     it has no dictionary to read from: two sentences, in the browser's language. */
  if ((navigator.language || "").toLowerCase().indexOf("fr") === 0) {
    document.documentElement.lang = "fr";
    document.getElementById("title").textContent = "Ponos ne joint pas son serveur";
    document.getElementById("text").textContent = "Les tickets vivent sur la machine qui fait tourner Ponos, jamais dans cette application : vérifiez qu’elle est allumée et que vous êtes sur le même réseau, puis réessayez.";
    document.getElementById("retry").textContent = "Réessayer";
  }
  document.getElementById("retry").addEventListener("click", function () { location.reload(); });
</script>
</body>
</html>
