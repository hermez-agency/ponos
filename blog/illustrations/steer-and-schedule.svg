<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="A rail of steps with a small card dropping a line onto it mid-way, and a branch leaving one step to climb towards a large orange ring" data-brand="ponos" stroke-linecap="round" stroke-linejoin="round">
<style>
