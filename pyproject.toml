# The project, as the Python tools read it.
#
# `dependencies` is what the runner imports beyond the standard library —
# httpx, since October 2026, and each one by a ticket of its own (see the
# audit). It reaches installations as `requirements.txt`, the export of
# `uv.lock`, which each version installs in its own `.venv` (environment.py):
# `install.sh` still asks the machine for python3 and git and nothing else.
# The rest is the tooling around the code — ruff, pytest — pinned in the same
# lockfile so that every machine and the CI lint and test with the same
# versions. `uv sync` installs both in `.venv`, and the suites run there.
#
# The version is written twice, here and in `src/ponos/__init__.py`:
# `scripts/release.py bump` moves both, and `check` refuses a tag where they
# disagree. See docs/audit-technique-2026-10.md for what comes next.

[project]
name = "ponos"
version = "0.1.0"
description = "Notion tickets turned into Claude Code sessions."
readme = "README.md"
license = "MIT"
authors = [{ name = "Hermez", email = "contact@cardona.digital" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
]

[project.urls]
Homepage = "https://hermez.dev"
Repository = "https://github.com/hermez-agency/ponos"

[dependency-groups]
dev = [
    "pre-commit>=4.7",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.13",
]

[tool.uv]
# Not built nor installed as a package: the launcher runs `src/` through
# PYTHONPATH, as it always has. The environment only holds the tools.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--durations=10"]
markers = [
    "functional: the whole road, on local doubles (tests/functional.py) — slower",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# Generated, or not Python of ours.
extend-exclude = ["src/ponos/web/static", "frontend", "diagrams"]

[tool.ruff.lint]
# Ruff's defaults (pyflakes, and the pycodestyle errors that are bugs), plus
# warnings and bugbear: what catches a mistake. Then imports in one order (I),
# the syntax of the Python we target (UP), and the simplifications (SIM) that
# read better — `ruff format` takes care of the commas. And no blind `except
# Exception` (BLE) that does not leave its trace in the journal: see log.py.
select = ["E4", "E7", "E9", "F", "W", "B", "I", "UP", "SIM", "BLE"]
ignore = [
    # try/except/pass is how the code says "this may fail, and that is fine",
    # next to the comment that says why; contextlib.suppress hides both.
    "SIM105",
    # A nested `if` keeps apart two questions a comment tells apart.
    "SIM102",
]
