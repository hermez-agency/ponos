# The project, as the Python tools read it.
#
# `dependencies` is what the code imports beyond the standard library — httpx
# for the runner, FastAPI served by uvicorn for the console (src/ponos/web/app.py),
# each one by a ticket of its own (see the audit). They reach installations as
# `requirements.txt`, the export of `uv.lock`, which each version installs in
# its own `.venv` (environment.py): `install.sh` still asks the machine for
# python3 and git and nothing else.
# The rest is the tooling around the code — ruff, mypy, pytest — pinned in the same
# lockfile so that every machine and the CI lint and test with the same
# versions. `uv sync` installs both in `.venv`, and the suites run there.
#
# The version is written twice, here and in `src/ponos/__init__.py`:
# `scripts/release.py bump` moves both, and `check` refuses a tag where they
# disagree. See docs/audit-technique-2026-10.md for what comes next.

[project]
name = "ponos"
version = "0.2.0"
description = "Notion tickets turned into Claude Code sessions."
readme = "README.md"
license = "MIT"
authors = [{ name = "Hermez", email = "contact@cardona.digital" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "fastapi>=0.151.0",
    "uvicorn>=0.54.0",
    "pydantic>=2.14.1",
]

[project.urls]
Homepage = "https://hermez.dev"
Repository = "https://github.com/hermez-agency/ponos"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "pytest-xdist>=3.8",
    "ruff>=0.13",
]

[tool.uv]
# Not built nor installed as a package: the launcher runs `src/` through
# PYTHONPATH, as it always has. The environment only holds the tools.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# One file per module, plus the whole road; `conftest.py` collects their `@case`.
python_files = ["test_*.py", "functional.py"]
# One worker per core (pytest-xdist): no case may lean on another having run
# first. `-n 0` runs them in one process, in order, for a debugger.
addopts = ["-ra", "--strict-markers", "--durations=10", "-n", "auto"]
markers = [
    "functional: the whole road, on local doubles (tests/functional.py) — slower",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# Generated, or not Python of ours.
extend-exclude = ["src/ponos/web/static", "frontend", "diagrams"]

[tool.ruff.lint]
# Ruff's defaults (pyflakes, and the pycodestyle errors that are bugs), plus
# warnings and bugbear: what catches a mistake. Then imports in one order (I),
# the syntax of the Python we target (UP), and the simplifications (SIM) that
# read better — `ruff format` takes care of the commas. And no blind `except
# Exception` (BLE) that does not leave its trace in the journal: see log.py.
select = ["E4", "E7", "E9", "F", "W", "B", "I", "UP", "SIM", "BLE"]
ignore = [
    # try/except/pass is how the code says "this may fail, and that is fine",
    # next to the comment that says why; contextlib.suppress hides both.
    "SIM105",
    # A nested `if` keeps apart two questions a comment tells apart.
    "SIM102",
]

[tool.ruff.lint.flake8-bugbear]
# How FastAPI is told what a parameter is: read once, when the route is filed.
extend-immutable-calls = ["fastapi.Body", "fastapi.Query"]

[tool.mypy]
# Strict for every module, but two lists hold back those not there yet, and
# they only ever shrink: a module leaves the first once `--strict` has nothing
# to say about it, and never comes back. A new module is strict from its
# first line. Started on the pure ones (ticket, naming, markdown, db, kinds,
# priority), which nothing but the standard library stands behind, and on
# those `--strict` already found nothing to say about.
python_version = "3.11"
mypy_path = "src"
packages = ["ponos"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Not strict yet: annotations are read as written, and an unannotated
# function is trusted. Remove a line, run `uv run mypy`, fix what it says.
module = [
    "ponos.__main__",
    "ponos.board",
    "ponos.channels",
    "ponos.channels.slack",
    "ponos.channels.telegram",
    "ponos.ci",
    "ponos.cleanup",
    "ponos.config",
    "ponos.conversation",
    "ponos.decisions",
    "ponos.delivery",
    "ponos.disk",
    "ponos.execution",
    "ponos.files",
    "ponos.git",
    "ponos.github_app",
    "ponos.github_token",
    "ponos.health",
    "ponos.ideas",
    "ponos.images",
    "ponos.journal",
    "ponos.legacy",
    "ponos.log",
    "ponos.models",
    "ponos.notify",
    "ponos.notion",
    "ponos.openrouter",
    "ponos.preparation",
    "ponos.progress",
    "ponos.project_settings",
    "ponos.provider",
    "ponos.provision",
    "ponos.recurrence",
    "ponos.replies",
    "ponos.reports",
    "ponos.runner",
    "ponos.session",
    "ponos.state",
    "ponos.store",
    "ponos.sync",
    "ponos.transitions",
    "ponos.unblocking",
    "ponos.update",
    "ponos.vault",
    "ponos.voice",
    "ponos.web.api",
    "ponos.web.attachments",
    "ponos.web.attempts",
    "ponos.web.board",
    "ponos.web.chats",
    "ponos.web.console",
    "ponos.web.creation",
    "ponos.web.github",
    "ponos.web.ideas",
    "ponos.web.live",
    "ponos.web.mcp",
    "ponos.web.mcp_setup",
    "ponos.web.oauth",
    "ponos.web.removal",
    "ponos.web.server",
    "ponos.web.settings",
    "ponos.web.setup",
    "ponos.web.statistics",
    "ponos.web.upgrade",
    "ponos.workspace",
    "ponos.worktime",
]
disallow_any_generics = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
warn_unused_ignores = false
warn_return_any = false
no_implicit_reexport = false
strict_equality = false
extra_checks = false

[[tool.mypy.overrides]]
# Not even that yet: what mypy finds there, lenient as above, is not read.
# Each is a ticket of its own to clean up, and leaves this list for the one
# above — or straight for strict.
module = [
    "ponos.__main__",
    "ponos.board",
    "ponos.cleanup",
    "ponos.delivery",
    "ponos.execution",
    "ponos.github_app",
    "ponos.health",
    "ponos.ideas",
    "ponos.legacy",
    "ponos.models",
    "ponos.notify",
    "ponos.preparation",
    "ponos.progress",
    "ponos.recurrence",
    "ponos.replies",
    "ponos.reports",
    "ponos.runner",
    "ponos.session",
    "ponos.transitions",
    "ponos.unblocking",
    "ponos.voice",
    "ponos.web.api",
    "ponos.web.board",
    "ponos.web.console",
    "ponos.web.ideas",
    "ponos.web.server",
    "ponos.web.settings",
    "ponos.web.setup",
    "ponos.web.statistics",
]
ignore_errors = true

[tool.coverage.run]
# What a test runs as `python3 -m ponos` — the commands of `__main__.py`, an
# update starting the new code — is code under test too: counted, it is what
# takes the total over the 80 % the CI asks for (`--cov-fail-under`).
patch = ["subprocess"]
